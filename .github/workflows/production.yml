# Production build for techfahm.com (cPanel shared hosting).
#
# How it works — no FTP password or server secret is stored anywhere:
#   1. Every push to main builds the static site (no base path) here.
#   2. The finished /out folder is force-pushed to the `production` branch.
#   3. A cron job on the cPanel account (deploy/cpanel-deploy.sh, every 5 min)
#      fetches `production` and copies it into public_html.
# See docs/DEPLOY.md.
name: Build production (techfahm.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build static site for techfahm.com
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - name: Sanity check
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/sitemap.xml
          if grep -q '/Techfahm/' out/index.html; then echo "base path leaked into production build"; exit 1; fi
      - name: Push build to the production branch
        working-directory: out
        run: |
          git init -q -b production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" production
